services:
  - type: web
    name: mario-server
    runtime: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: npm_config_build_from_source
        value: "true"
      - key: PYTHON
        value: /usr/bin/python3
